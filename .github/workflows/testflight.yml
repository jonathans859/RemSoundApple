name: TestFlight

# Every push to main builds a cloud-signed iOS IPA and a cloud-signed macOS PKG
# and uploads both to TestFlight. The internal group "Core" has automatic
# distribution enabled in App Store Connect, so it receives them as soon as
# processing finishes, with the push's commit subjects as "What to Test".
#
# Releases do NOT rebuild -- release.yml promotes the build this workflow already
# produced for the tagged commit, so external testers get the byte-identical
# binary internal testers ran.
#
# Both platforms share ONE App Store Connect app record (universal purchase): the
# iOS and macOS targets use the same bundle id com.jonathan859.remsound, and the
# record must have the macOS platform added (App Store Connect -> RemSound -> Add
# Platform) before the first macOS upload. asc infers the platform from the file
# it is given (.ipa vs .pkg), so nothing has to disambiguate it.
#
# The pipeline itself lives in jonathans859/apple-ci, shared with every app on
# this Apple account: archive, export, upload, versioning and the one shared
# Apple Development certificate are defined once there rather than six times.

on:
  push:
    branches: [main]
    # Docs-only and CI-only pushes must not mint a TestFlight build. A push is
    # skipped only when EVERY changed file matches; anything mixing code and
    # these still builds.
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - ".github/workflows/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# Serialize uploads against the one app record. The iOS and macOS jobs of a
# single run may safely overlap: App Store Connect processes them independently.
concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  test:
    name: RemSoundKit unit tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: swift test --package-path RemSoundKit

  ios:
    needs: test
    uses: jonathans859/apple-ci/.github/workflows/testflight.yml@v1
    secrets: inherit
    with:
      platform: ios
      # The .xcodeproj is hand-written and committed here, so there is no spec to
      # generate from and the version comes from the pbxproj.
      project: RemSound.xcodeproj
      scheme: RemSound-iOS
      app-id: "6787399914"
      version-source: pbxproj
      artifact-name: RemSound-ios-ipa

  macos:
    needs: test
    uses: jonathans859/apple-ci/.github/workflows/testflight.yml@v1
    secrets: inherit
    with:
      platform: macos
      project: RemSound.xcodeproj
      scheme: RemSound-macOS
      app-id: "6787399914"
      version-source: pbxproj
      artifact-name: RemSound-macos-pkg
