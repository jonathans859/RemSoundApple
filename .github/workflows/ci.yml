name: CI

# PULL REQUESTS ONLY. On a push to main, testflight.yml compiles both platforms
# against the real SDK and signs them minutes later, so building them unsigned
# here as well was the same work twice on 10x-billed runners. Pull requests still
# need it: they have no access to signing secrets, so this is the only place a PR
# is compiled at all.
#
# Docs-only changes skip it entirely (skipped only when EVERY changed file matches).
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"

jobs:
  test-kit:
    name: RemSoundKit unit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: swift test --package-path RemSoundKit

  build-macos:
    name: Build macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project RemSound.xcodeproj \
            -scheme RemSound-macOS \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
      - name: Zip app
        run: ditto -c -k --keepParent build/Build/Products/Release/RemSound.app RemSound-macOS-unsigned.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RemSound-macOS-unsigned
          path: RemSound-macOS-unsigned.zip

  build-ios:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build (unsigned, device SDK)
        run: |
          xcodebuild build \
            -project RemSound.xcodeproj \
            -scheme RemSound-iOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RemSound.app Payload/
          zip -qry RemSound-iOS-unsigned.ipa Payload
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RemSound-iOS-unsigned
          path: RemSound-iOS-unsigned.ipa
